[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synth-artiste"
version = "0.1.0"
description = "Workflow-focused image generation and perceptual comparison"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26", 
    "Pillow>=10.4", 
    "python-dotenv>=1.0", 
    "openai>=2", 
    "google-genai>=1", 
    "scipy>=1.12", 
    "scikit-learn>=1.5", 
    "matplotlib>=3.8"
]

[project.optional-dependencies]
vision = [
    "torch>=2.7", 
    "torchvision>=0.22", 
    "diffusers>=0.35", 
    "transformers>=5", 
    "accelerate>=1", 
    "peft>=0.19", 
    "dreamsim>=0.2", 
    "lpips>=0.1.4", 
    "tpips", 
    "timm", 
    "einops", 
    "umap-learn>=0.5"
]
notebooks = [
    "nbformat>=5", 
    "nbclient>=0.10", 
    "ipykernel>=6", 
    "jupyterlab>=4"
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["synthart*"]

[tool.pytest.ini_options]
testpaths = ["testing"]
